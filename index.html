<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="Plataforma de preparación de oposiciones con IA: temario, banco de preguntas, simulacros, repaso inteligente y estadísticas.">
  <title>Opositor IA</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f54c8'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='700' font-size='16' fill='white' text-anchor='middle'%3EO%3C/text%3E%3C/svg%3E">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="assets/css/app.css">
  <script>
    // Aplica el tema antes de pintar para evitar parpadeos
    (function () {
      try {
        var t = localStorage.getItem('opo-tema') || 'auto';
        var dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="root"><div class="loading"><span class="spinner"></span> Cargando…</div></div>
  <div class="toasts" id="toasts"></div>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
